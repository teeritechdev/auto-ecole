server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Application Angular (SPA) : toute route inconnue retombe sur index.html,
    # le routeur Angular se charge du reste côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API backend, sur le même conteneur/domaine que le frontend :
    # le nom "backend" est résolu via le réseau Docker Compose.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentation Swagger (protégée côté backend si APP_SWAGGER_PUBLIC=false)
    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/(swagger-ui|swagger-ui.html) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
