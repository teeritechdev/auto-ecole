services:
  postgres:
    image: postgres:16
    container_name: autoecole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-auto_ecole_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?La variable DB_PASSWORD est obligatoire (voir .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-auto_ecole_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: autoecole-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-auto_ecole_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?La variable DB_PASSWORD est obligatoire (voir .env.example)}
      JWT_SECRET: ${JWT_SECRET:?La variable JWT_SECRET est obligatoire (openssl rand -base64 64)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-7200000}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SWAGGER_PUBLIC: ${APP_SWAGGER_PUBLIC:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      APP_ETABLISSEMENT_NOM: ${APP_ETABLISSEMENT_NOM:-NERWAYA AUTO-ÉCOLE}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: autoecole-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres_data:
    driver: local
