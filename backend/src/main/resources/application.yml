server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: auto-ecole-backend
  datasource:
    url: jdbc:mysql://localhost:3306/auto_ecole_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Application Custom Properties
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B597036733979244226452948404D635166546A576E5A72347537
    expiration-ms: 86400000 # 24 heures en millisecondes
  cors:
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200"
