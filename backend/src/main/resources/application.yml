server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: auto-ecole-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auto_ecole_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

# Supervision : seul /actuator/health est exposé (pour les probes Docker / orchestrateur),
# sans détail interne (composants, connexions DB, etc.) qui pourrait renseigner un attaquant.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Application Custom Properties
app:
  jwt:
    # IMPORTANT : en production, définissez la variable d'environnement JWT_SECRET
    # avec une clé forte générée aléatoirement (ex: openssl rand -base64 64).
    # La valeur ci-dessous est un placeholder de développement, volontairement
    # identifiable et non sécurisé — ne jamais la garder telle quelle en prod.
    secret: ${JWT_SECRET:SU5TRUNVUkUtREVWLU9OTFktREVGQVVMVC1KV1QtU0VDUkVULUNIQU5HRS1NRS1JTi1QUk9EVUNUSU9OLTAwMDAwMDAwMDA=}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000} # 2 heures (réduit depuis 24h)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  seed:
    enabled: ${APP_SEED_ENABLED:true} # désactiver en production (APP_SEED_ENABLED=false)
  swagger:
    public: ${APP_SWAGGER_PUBLIC:true} # désactiver en production (APP_SWAGGER_PUBLIC=false)
  etablissement:
    nom: ${APP_ETABLISSEMENT_NOM:NERWAYA AUTO-ÉCOLE} # nom affiché sur les documents officiels (reçus, PDF)
  security:
    login:
      max-attempts: ${APP_LOGIN_MAX_ATTEMPTS:5} # tentatives échouées avant verrouillage temporaire
      lockout-minutes: ${APP_LOGIN_LOCKOUT_MINUTES:15} # durée du verrouillage
  inscription:
    duree-validite-mois: ${APP_INSCRIPTION_DUREE_VALIDITE_MOIS:8} # RG07 : durée de validité d'un cycle d'inscription
