server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité (cf. securityheaders.com) : appliqués au niveau du bloc
    # server, donc hérités par tous les "location" ci-dessous tant qu'aucun d'eux
    # ne redéclare lui-même add_header (Nginx n'hérite plus du tout sinon).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Application Angular (SPA) : toute route inconnue retombe sur index.html,
    # le routeur Angular se charge du reste côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API backend, sur le même conteneur/domaine que le frontend :
    # le nom "backend" est résolu via le réseau Docker Compose.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentation Swagger (protégée côté backend si APP_SWAGGER_PUBLIC=false)
    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/(swagger-ui|swagger-ui.html) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
